services:
  - type: web
    name: calce-matices-publica
    runtime: python
    plan: free
    branch: deploy/calce-matices-publica
    rootDir: Calce y Matices Integrado
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VTON_API_URL
        sync: false
      - key: VTON_API_TOKEN
        sync: false
